<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vast Virtual 3D NFT Museum</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">🏛️ Vast 3D NFT Museum | Drag to look around, Scroll to zoom, WASD / Arrow keys to navigate</div>
    <div id="instructions">Spacious Exhibition Hall with Real NFT & Digital Art Displays</div>

    <!-- Include Three.js and OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // =====================================================================
        // 🏛️ MUSEUM CONFIGURATION & SPACIOUSNESS (Adjust these numbers anytime)
        // =====================================================================
        const roomWidth = 65;   // Width of the hall (Make it wider)
        const roomHeight = 24;  // Cathedral ceiling height (Make it taller)
        const roomLength = 350; // Length of the exhibition corridor (Make it longer)

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0c);
        scene.fog = new THREE.FogExp2(0x0a0a0c, 0.006); // Atmospheric depth fog

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01; // Prevent going below ground
        controls.minDistance = 3;
        controls.maxDistance = 180;

        // 2. Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
        scene.add(ambientLight);

        const ceilingLight = new THREE.DirectionalLight(0xffffff, 0.5);
        ceilingLight.position.set(0, roomHeight - 2, 0);
        ceilingLight.castShadow = true;
        scene.add(ceilingLight);

        // 3. Architecture Construction (Spacious Walls, Floor, & Ceiling)
        const floorGeo = new THREE.PlaneGeometry(roomWidth, roomLength);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x121215, roughness: 0.15, metalness: 0.85 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0e, roughness: 0.9 });
        const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = roomHeight;
        scene.add(ceiling);

        const wallGeo = new THREE.PlaneGeometry(roomLength, roomHeight);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a20, roughness: 0.8 });
        
        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
        scene.add(rightWall);

        // 4. NFT Display Loader Function
        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = 'anonymous'; // Ensures external NFT images load safely

        function createNFTDisplay(imageUrl, x, y, z, rotationY) {
            // Elegant Museum Frame Border
            const frameWidth = 6.5;
            const frameHeight = 8;
            const frameGeo = new THREE.BoxGeometry(frameWidth, frameHeight, 0.35);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x222226, roughness: 0.4, metalness: 0.7 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(x, y, z);
            frame.rotation.y = rotationY;
            scene.add(frame);

            // NFT Art Plane Inside Frame
            const artGeo = new THREE.PlaneGeometry(frameWidth - 0.5, frameHeight - 0.5);
            
            textureLoader.load(imageUrl, 
                (texture) => {
                    const artMat = new THREE.MeshBasicMaterial({ map: texture });
                    const art = new THREE.Mesh(artGeo, artMat);
                    
                    if (Math.abs(rotationY - Math.PI / 2) < 0.1) {
                        art.position.set(x - 0.19, y, z);
                    } else {
                        art.position.set(x + 0.19, y, z);
                    }
                    art.rotation.y = rotationY;
                    scene.add(art);
                },
                undefined,
                (err) => {
                    console.warn("Failed to load NFT asset URL:", imageUrl);
                }
            );

            // Spotlight shining down on the NFT display
            const spotLight = new THREE.SpotLight(0xfff3e0, 1.8);
            if (Math.abs(rotationY - Math.PI / 2) < 0.1) {
                spotLight.position.set(x + 6, roomHeight - 2, z);
            } else {
                spotLight.position.set(x - 6, roomHeight - 2, z);
            }
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 0.5;
            scene.add(spotLight);
        }

        // =====================================================================
        // 🖼️ REAL NFT / DIGITAL ART COLLECTION URLS
        // =====================================================================
        // Replace these URLs with your real NFT image links (PNG, JPEG, IPFS links, etc.)
        const realNFTs = [
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000",
            "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=1000",
            "https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=1000",
            "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=1000",
            "https://images.unsplash.com/photo-1633167606207-d840b5070fc2?w=1000",
            "https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=1000",
            "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=1000",
            "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=1000",
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000",
            "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=1000"
        ];

        // Layout the NFTs down both sides of the huge corridor automatically
        let zPos = -140;
        const spacing = 40; // Distance spacing between frames

        for (let i = 0; i < realNFTs.length; i++) {
            if (i % 2 === 0) {
                // Left Wall
                createNFTDisplay(realNFTs[i], -roomWidth / 2 + 0.2, 5.5, zPos, Math.PI / 2);
            } else {
                // Right Wall
                createNFTDisplay(realNFTs[i], roomWidth / 2 - 0.2, 5.5, zPos, -Math.PI / 2);
                zPos += spacing; // Step forward down the hall for the next pair
            }
        }

        // 6. Handle Browser Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Animation / Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
